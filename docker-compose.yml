# 무중단 배포: 래퍼는 두 자리(blue·green)로 뜨고 nginx 가 그중 하나로 보낸다. 평소에는 한 자리만 떠 있다.
# 전환은 ci-cd agent 가 한다(deploy/active/ 갱신 → nginx reload). Ollama 는 한 벌 그대로다.
x-wrapper: &wrapper
  build: ./wrapper
  image: llm-wrapper:${IMAGE_TAG:-local}   # ci-cd: CI 가 커밋 태그로 빌드, CD 가 그 태그로 교체
  environment:
    OLLAMA_URL: http://ollama:11434
    MODEL: ${MODEL:-qwen3:8b}
    MAX_INFLIGHT: ${MAX_INFLIGHT:-2}
    CHAT_MAX_WAITING: ${CHAT_MAX_WAITING:-8}
    CHAT_WAIT_TIMEOUT_S: ${CHAT_WAIT_TIMEOUT_S:-60}
    CHAT_QUEUE_HEARTBEAT_S: ${CHAT_QUEUE_HEARTBEAT_S:-10}
    REWRITE_TIMEOUT_S: ${REWRITE_TIMEOUT_S:-5}
    SERVER_NAME: llm-wrapper
    # 로그 중앙 큐 (Redis Stream, backend 호스트에 기동 예정 — 포트 6379 예약).
    # 비우면 서버 로그만 남긴다. 실제 주소는 배포 .env에서 지정(리포에 IP 금지).
    LOG_REDIS_URL: ${LOG_REDIS_URL:-}
    LOG_STREAM: ${LOG_STREAM:-logs}
  depends_on:
    ollama:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
  restart: unless-stopped
  stop_grace_period: 30s

services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    # 호스트 비노출 — wrapper만 내부 네트워크로 접근 (design D1)
    expose:
      - "11434"
    env_file: ollama/.env
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # localhost 금지 — 컨테이너 안에서 ::1로 풀려 IPv4 바인딩 서버가 unhealthy로 찍힘
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  wrapper-blue:
    <<: *wrapper
    profiles: ["blue"]           # 이름을 지정해야만 뜬다 — `docker compose up -d` 가 두 자리를 한꺼번에 띄우지 않게
    container_name: llm-wrapper-blue
    ports:
      - "127.0.0.1:18000:8000"     # agent 의 자리별 헬스 확인·정리 알림용 — 외부에는 nginx 만 열린다
  wrapper-green:
    <<: *wrapper
    profiles: ["green"]
    container_name: llm-wrapper-green
    ports:
      - "127.0.0.1:18001:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: llm-nginx
    ports:
      - "8000:8000"
    volumes:
      # nginx 는 git 밖의 활성 디렉토리만 읽는다(서버에만 있다): nginx.conf(본 설정 사본) + upstream.conf(활성 자리).
      - ./deploy/active:/etc/nginx:ro
    restart: unless-stopped

volumes:
  ollama-models:
