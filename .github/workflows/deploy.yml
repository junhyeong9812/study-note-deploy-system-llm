name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy          # 같은 서비스의 배포는 한 번에 하나 — 앞 실행이 끝난 뒤 다음이 접수된다
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 접수 대기 최대 20분 + 조회 최대 25분 + 여유
    env:
      SERVICE: llm
      DEPLOY_URL: https://www.junproject.xyz/api/deploy
      DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
      # 재실행(run_attempt)마다 번호가 달라야 새 배포로 접수된다 — 같은 번호는 master가 기존 건으로 취급
      REQUEST_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: submit (접수 — 실패하면 재시도, 끝내 안 되면 빨간불)
        run: |
          body=$(printf '{"service":"%s","commit_sha":"%s","request_id":"%s"}' "$SERVICE" "$GITHUB_SHA" "$REQUEST_ID")
          transient=0; busy=0
          while true; do
            code=$(curl -sS --http1.1 -A "study-note-deploy/1.0" --max-time 30 -o response.json -w '%{http_code}' \
              -X POST "$DEPLOY_URL" -H "X-Deploy-Secret: $DEPLOY_SECRET" -H "Content-Type: application/json" \
              -d "$body" 2>curl-error.txt) || true
            echo "submit: http=${code:-000} $(head -c 300 response.json 2>/dev/null) $(head -c 200 curl-error.txt)"
            if [ "${code:0:1}" = "2" ]; then
              exit 0
            elif [ "$code" = "409" ]; then
              busy=$((busy + 1))                  # 같은 서비스가 배포 중 — 끝나기를 기다린다 (최대 20분)
              [ "$busy" -ge 40 ] && { echo "::error::409 가 20분 넘게 계속됨"; exit 1; }
              sleep 30
            else
              transient=$((transient + 1))        # 엣지 504·연결 실패 등 — 홈 회선이 약 20초씩 끊기는 것을 넘긴다
              [ "$transient" -ge 5 ] && { echo "::error::접수 실패 5회 (마지막 http ${code:-000})"; exit 1; }
              sleep 20
            fi
          done

      - name: wait (배포가 끝날 때까지 조회 — succeeded 일 때만 초록불)
        run: |
          deadline=$((SECONDS + 1500)); missing=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -sS --http1.1 -A "study-note-deploy/1.0" --max-time 20 -o status.json -w '%{http_code}' \
              "$DEPLOY_URL/$REQUEST_ID" -H "X-Deploy-Secret: $DEPLOY_SECRET" 2>curl-error.txt) || true
            if [ "$code" = "200" ]; then
              missing=0
              state=$(jq -r '.data.state // "unknown"' status.json 2>/dev/null) || state=unreadable   # 본문이 깨져도 다음 조회로 넘긴다
              echo "status: $state"
              if [ "$state" = "succeeded" ]; then
                deployed=$(jq -r '.data.commit_sha' status.json)
                [ "$deployed" = "$GITHUB_SHA" ] || { echo "::error::배포된 커밋이 다름: $deployed"; exit 1; }
                exit 0
              elif [ "$state" = "failed" ]; then
                echo "::error::배포 실패 — 단계: $(jq -r '.data.failed_stage' status.json)"
                echo "----- 출력 끝부분 -----"; jq -r '.data.detail // ""' status.json
                exit 1
              fi
            elif [ "$code" = "404" ]; then
              missing=$((missing + 1))            # 접수된 건을 master가 모른다 — 일시 오류가 아니다
              [ "$missing" -ge 3 ] && { echo "::error::접수한 배포를 찾을 수 없음 ($REQUEST_ID)"; exit 1; }
            else
              echo "status: 조회 실패 http=${code:-000} $(head -c 200 curl-error.txt) — 다시 시도"
            fi
            sleep 10
          done
          echo "::error::25분 안에 끝나지 않음 — 마지막 상태: $(jq -r '.data.state // "unknown"' status.json 2>/dev/null)"
          exit 1
